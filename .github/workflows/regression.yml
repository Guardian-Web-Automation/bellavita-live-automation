name: Bellavita Live Regression

# Run before every release from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
    inputs:
      preview_theme_id:
        description: 'Theme to test (defaults to the live theme). Use a ticket theme ID to test a preview.'
        required: false
      include_checkout:
        description: 'Place a real COD order (auto-cancelled by Shopify Flow)'
        type: boolean
        default: true

permissions:
  contents: write # push the HTML report to the gh-pages branch

concurrency:
  group: regression
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run Playwright suite
        id: run
        continue-on-error: true # still publish the report and post to Slack when tests fail
        env:
          BASE_URL: https://bellavitaorganic.com/
          PREVIEW_THEME_ID: ${{ inputs.preview_theme_id || vars.LIVE_THEME_ID }}
          TEST_PHONE: ${{ inputs.include_checkout && secrets.TEST_PHONE || '' }}
          OTP_SENDER_EMAIL: ${{ secrets.OTP_SENDER_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: npx playwright test

      - name: Publish HTML report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
          destination_dir: runs/${{ github.run_number }}
          keep_files: true # keep earlier runs' reports

      - name: Post summary to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/runs/${{ github.run_number }}/
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/slack-summary.mjs results.json
